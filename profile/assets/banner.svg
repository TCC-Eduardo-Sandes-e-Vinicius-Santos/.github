<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 80" width="100%" height="80">
  <style>
    .pacman-group {
      animation: move-pacman 6s linear infinite;
    }
    .top-jaw {
      transform-origin: 0px 40px;
      animation: chomp-top 0.25s infinite alternate ease-in-out;
    }
    .bottom-jaw {
      transform-origin: 0px 40px;
      animation: chomp-bottom 0.25s infinite alternate ease-in-out;
    }
    .eye-outline {
      fill: none;
      stroke: #D9D9D9;
      stroke-width: 2;
      stroke-linejoin: round;
    }
    .eye-core {
      fill: #FFFFFF;
    }

    .d1 { animation: eat-d1 6s linear infinite; }
    .d2 { animation: eat-d2 6s linear infinite; }
    .d3 { animation: eat-d3 6s linear infinite; }
    .d4 { animation: eat-d4 6s linear infinite; }

    @keyframes move-pacman {
      0% { transform: translateX(-40px); }
      100% { transform: translateX(840px); }
    }
    @keyframes chomp-top {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(-35deg); }
    }
    @keyframes chomp-bottom {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(35deg); }
    }

    @keyframes eat-d1 { 0%, 22.5% { opacity: 1; } 23%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes eat-d2 { 0%, 40.7% { opacity: 1; } 41.2%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes eat-d3 { 0%, 58.8% { opacity: 1; } 59.3%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes eat-d4 { 0%, 77% { opacity: 1; } 77.5%, 99.9% { opacity: 0; } 100% { opacity: 1; } }
  </style>

  <!-- 4 olhos espalhados pelo caminho -->
  <g transform="translate(160, 40)">
    <g class="d1">
      <path class="eye-outline" d="M -12,0 Q 0,-13 12,0 Q 0,13 -12,0 Z" />
      <circle class="eye-core" cx="0" cy="0" r="3.8" />
    </g>
  </g>
  <g transform="translate(320, 40)">
    <g class="d2">
      <path class="eye-outline" d="M -12,0 Q 0,-13 12,0 Q 0,13 -12,0 Z" />
      <circle class="eye-core" cx="0" cy="0" r="3.8" />
    </g>
  </g>
  <g transform="translate(480, 40)">
    <g class="d3">
      <path class="eye-outline" d="M -12,0 Q 0,-13 12,0 Q 0,13 -12,0 Z" />
      <circle class="eye-core" cx="0" cy="0" r="3.8" />
    </g>
  </g>
  <g transform="translate(640, 40)">
    <g class="d4">
      <path class="eye-outline" d="M -12,0 Q 0,-13 12,0 Q 0,13 -12,0 Z" />
      <circle class="eye-core" cx="0" cy="0" r="3.8" />
    </g>
  </g>

  <!-- Personagem Pac-Man -->
  <g class="pacman-group">
    <path class="top-jaw" d="M 0,40 L 24,40 A 24,24 0 1,0 -24,40 Z" fill="#EEFF00" />
    <path class="bottom-jaw" d="M 0,40 L -24,40 A 24,24 0 1,0 24,40 Z" fill="#EEFF00" />
  </g>
</svg>